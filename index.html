<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Aaron Phan is a software engineer building cloud-native backends in Go, graduating in electrical and computer engineering at UT Austin in December 2026."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Aaron Phan | Software engineer</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          try {
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          } catch (e) {
            t = 'light'
          }
        }
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body class="bg-background font-sans text-text antialiased">
    <div id="root">
      <main id="main" tabindex="-1" class="outline-none">
        <section
          id="hero"
          aria-labelledby="hero-heading"
          class="py-8 md:flex md:min-h-[calc(100svh-64px)] md:py-10"
        >
          <div
            class="poster-grid mx-auto w-full max-w-[1680px] px-[clamp(1rem,2vw,2rem)] md:grid-rows-[auto_1fr_auto]"
          >
            <h1
              id="hero-heading"
              class="col-span-full -ms-[0.055em] text-mega text-balance md:col-span-9 md:row-start-1"
            >
              <span class="block">Aaron</span> <span class="block">Phan</span>
            </h1>
            <p class="col-span-full text-l text-text md:col-span-6 md:row-start-2 md:self-center">
              Software engineer building cloud-native backends in Go.
            </p>
            <div
              class="col-span-full flex flex-col gap-4 md:col-span-4 md:col-start-9 md:row-start-2 md:self-center"
            >
              <a
                href="%BASE_URL%resume.pdf"
                download
                class="cta cta-filled relative isolate inline-flex min-h-11 items-center justify-center overflow-hidden rounded-pill bg-primary px-6 text-s font-medium text-on-primary md:min-w-[200px]"
              >
                <span class="cta-flood" aria-hidden="true"></span>
                <span class="cta-label">Download resume</span>
              </a>
              <a
                href="mailto:aaron.phan240@gmail.com"
                class="cta cta-outlined relative isolate inline-flex min-h-11 items-center justify-center overflow-hidden rounded-pill border border-border-strong px-6 text-s font-medium text-text md:min-w-[200px]"
              >
                <span class="cta-flood" aria-hidden="true"></span>
                <span class="cta-label">Copy email</span>
              </a>
            </div>
            <div
              class="col-span-full flex flex-col gap-1 text-s text-muted tabular-nums md:row-start-3 md:flex-row md:justify-between"
            >
              <p>Graduating December 2026, UT Austin ECE</p>
              <p>Last role: Capital One, summer 2026</p>
            </div>
          </div>
        </section>
        <section
          id="experience"
          aria-labelledby="experience-heading"
          class="min-h-[40svh] scroll-mt-6 py-16"
        >
          <div class="mx-auto max-w-[1680px] px-[clamp(1rem,2vw,2rem)]">
            <h2 id="experience-heading" class="text-xl">Experience</h2>
          </div>
        </section>
        <section
          id="projects"
          aria-labelledby="projects-heading"
          class="min-h-[40svh] scroll-mt-6 py-16"
        >
          <div class="mx-auto max-w-[1680px] px-[clamp(1rem,2vw,2rem)]">
            <h2 id="projects-heading" class="text-xl">Projects</h2>
          </div>
        </section>
        <section id="about" aria-labelledby="about-heading" class="min-h-[40svh] scroll-mt-6 py-16">
          <div class="mx-auto max-w-[1680px] px-[clamp(1rem,2vw,2rem)]">
            <h2 id="about-heading" class="text-xl">About Me</h2>
          </div>
        </section>
        <section
          id="skills"
          aria-labelledby="skills-heading"
          class="min-h-[40svh] scroll-mt-6 py-16"
        >
          <div class="mx-auto max-w-[1680px] px-[clamp(1rem,2vw,2rem)]">
            <h2 id="skills-heading" class="text-xl">Skills</h2>
          </div>
        </section>
        <section
          id="education"
          aria-labelledby="education-heading"
          class="min-h-[40svh] scroll-mt-6 py-16"
        >
          <div class="mx-auto max-w-[1680px] px-[clamp(1rem,2vw,2rem)]">
            <h2 id="education-heading" class="text-xl">Education</h2>
          </div>
        </section>
        <section
          id="contact"
          aria-labelledby="contact-heading"
          class="min-h-[40svh] scroll-mt-6 py-16"
        >
          <div class="mx-auto max-w-[1680px] px-[clamp(1rem,2vw,2rem)]">
            <h2 id="contact-heading" class="text-xl">Contact Me</h2>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
